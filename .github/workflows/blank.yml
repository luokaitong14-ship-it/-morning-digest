 name: 每日晨报

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  morning-digest:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install feedparser python-dotenv openai

      - name: 运行晨报
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          ARK_ENDPOINT_ID: ${{ secrets.ARK_ENDPOINT_ID }}
        run: python digest.py

      - name: 提交晨报
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morning.md
          git diff --cached --quiet || git commit -m "Update morning digest"
          git push
