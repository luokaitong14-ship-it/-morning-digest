name: 每日晨报

'on':
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  morning-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser python-dotenv openai

      - name: Run digest
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          ARK_ENDPOINT_ID: ${{ secrets.ARK_ENDPOINT_ID }}
        run: python digest.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morning.md
          git diff --cached --quiet || git commit -m "Update morning digest"
          git push
